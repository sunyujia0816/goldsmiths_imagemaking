<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 界面风格修改的地方放在这里，不要放在body里面，保证里面正文内容-->
    <title>home</title>

    <link rel="stylesheet" href="main.css">
    <!-- 连接到style sheet，-->
    <style>
        /* 在这里写颜色的话，就会把前面link到的main style sheet里面的内容覆盖掉 ... */
        body {
            background: #ffe27b;
        }
    </style>

    <script>
        /*就像style一样，在这里写的东西也可以放到一个文件夹里然后，放到上面的src
        这里写的是弹窗内容 script是脚本的意识... */
        alert("OuO");
        /*
        这里蓝色tag就像茶杯一样，在里面写的东西就被装了起来，可以迁移到其他地方（好像是）
        ... */
        console.log("hello world");
        /*
        console 控制台，浏览器更多工具，开发者工具打开，左边是代码，右边是css，下面是控制台，console的东西就在里面
        ... */
        //comment，注释其实这样也是对的

        var benugo = 'coffee'; //这里本质上是在定义变量
        var age = 22;
        var length = 100.5;

        alert(benugo);
        alert(age);
        alert(length);//在这里括号中间的词就不再是单独的词汇而是变量名字
    </script>


</head>
<body>
    <p class="top" id="first" >Hello World</p>
    <!--  使用这种办法来区分不同段落，class里面可以有很多，
      id让class里面的每一段都独一无二-->
    <p class="top" > Hello World </p>

    <p>Goodbye World</p>
    <p>Goodbye World</p>

    <img src="images/week04.jpg" alt="meme" width = "200" height = "240">
    <img width = "150" src="images/week04.jpg" alt="">
    <!--  修饰图片大小 只用width的话只是规定宽度，高度他会自己调整不会拉伸，还不错-->

    <video width="320" height="200" controls loop autoplay>
        <source src="videos/week04.mp4" type="video/mp4">
    </video>
    <!--  control在这里的意思是播放器的意思大概，反正就是可以灵活的改变在
    这里插入的视频-- loop是自动重播-->

    <p class="top" >

        <a href="second-page.html">
        this is a second page
            <img width = "150" src="images/week04.jpg" alt="">
        </a>

        <img width = "150" src="https://buybc.gov.bc.ca/app/uploads/sites/386/2024/03/Tomatoes_190495029.png" alt="??">
        <video width="320" height="200" controls loop autoplay>
            <source src="videos/week04.mp4" type="video/mp4">
        </video>

        <iframe width="560" height="315" src="https://www.youtube.com/embed/-_sUzeqJmvI?si=WLq3XOVylLC6S5tU" title="YouTube video player"  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>


    <!--  anchor锚点缩写为a，href在属性的位置插入超链接--,前面的链接是真实去向的网站，
    后面写的是按钮的名字，同时呢这里的显示物还能是图片，之所以<video> 标签在这里再次出现，只是说明video可以使用链接，但是
    只支持直接指向 .mp4、.webm 等视频文件的直链，而 YouTube 链接指向的是网页，所以无论怎么改后缀，
    <video> 标签都无法播放-->

    </p>

</body>
</html>
