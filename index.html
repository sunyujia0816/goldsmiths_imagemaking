<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 界面风格修改的地方放在这里，不要放在body里面，保证里面正文内容-->
    <title>home</title>

    <style>
        body {
            margin: 0;
            padding: 10px;
            background: #faa5a5;
            color: #00448e;
        }
        /* margin是边框，padding是元素之间的间距，background是背景颜
        色，color是字体颜色，同时在这里的注释不一样因为这里是css，在左边
        点击色块可以很方便的修改颜色... */
        p {
            margin: 10px;
            padding: 15px;
            background: #b6f4f4;
        }
        /*关联到下面的<p>所以这里是p，但是这里的p同时对所有的段落起作用
        .TOP 表示类别，#first表示individuals，同时这三个类别是母子关系，
        大类别的变化会改变小的尽量用这样的办法让网页变得整洁*/

        .top{
            width: 120%;
            background-color: #ffe27b
        }

        #first{
            background: #2e9bff
            font-family : Arial Helvetica sans-serif;
        }
        p #first{
            margin: 10px;
            padding: 15px;
            background: #b6f4f4;
        }
        /* 在这里p#first可以特别用来指出p段落下的#first标签哪点内容 */
        img{
            margin: 10px;
        }

    </style>
</head>
<body>
    <p class="top" id="first" >Hello World</p>
<!--  使用这种办法来区分不同段落，class里面可以有很多，
      id让class里面的每一段都独一无二-->
    <p class="top" > Hello World </p>

    <p>Goodbye World</p>
    <p>Goodbye World</p>

    <img src="images/week04.jpg" alt="meme" width = "200" height = "240">
    <!--  修饰图片大小 只用width的话只是规定宽度，高度他会自己调整不会拉伸，还不错-->

    <video width="320" height="200" controls="true" loop autoplay>
        <source src="videos/week04.mp4" type="video/mp4">
    </video>
    <!--  control在这里的意思是播放器的意思大概，反正就是可以灵活的改变在
    这里插入的视频-- loop是自动重播-->

    <p class="top" >
    <a href="second-page.html">this is a search engine</a>
    <!--  anchor锚点缩写为a，href在属性的位置插入超链接-->
    </p>

</body>
</html>
